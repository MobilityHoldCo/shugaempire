<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAINTENANCE MODE | SHUGA EMPIRE</title>
  <meta name="description" content="Shuga Empire is currently under maintenance." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background Image with Black & White treatment */
    .bg-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%) contrast(125%) brightness(0.4);
      transform: scale(1.03);
      animation: subtleZoom 20s ease-in-out infinite alternate;
    }

    @keyframes subtleZoom {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.06); }
    }

    /* Dark vignette and overlays */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.88) 75%, #000000 100%);
    }

    /* Content Area */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.5rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    h1.title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.8rem, 8vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.05;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 80px rgba(255, 255, 255, 0.15);
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 1.5rem;
      width: 100%;
    }

    .status-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      h1.title {
        letter-spacing: 0.04em;
        font-size: clamp(2.2rem, 9vw, 3.8rem);
      }
      .brand {
        letter-spacing: 0.2em;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background in Black & White -->
  <div class="bg-wrap">
    <img src="/maintenance-hero.jpg" alt="Maintenance" class="bg-img" />
    <div class="bg-overlay"></div>
  </div>

  <!-- Big Minimal Maintenance Mode Content -->
  <main class="container">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>SHUGA EMPIRE</span>
    </div>

    <h1 class="title">MAINTENANCE MODE</h1>

    <div class="status-badge">
      SYSTEM OFFLINE &bull; WE WILL BE BACK SHORTLY
    </div>
  </main>

</body>
</html>
